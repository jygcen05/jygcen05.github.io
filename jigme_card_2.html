<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Card - Jigme Wangchuk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .card {
    width: 700px;
    height: 270px;
    background: #ffffff;
    display: flex;
    box-shadow: 0 6px 30px rgba(0,0,0,0.15);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .left-panel {
    width: 220px;
    background: #1a7a7a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 18px;
    position: relative;
    flex-shrink: 0;
  }
  .logo-area {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo-icon {
    width: 48px;
    height: 48px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .logo-text {
    color: white;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
    line-height: 1.3;
  }
  .photo-wrapper {
    width: 130px;
    height: 160px;
    border: 3px solid white;
    overflow: hidden;
    background: #ccc;
    position: relative;
    bottom: -5px;
  }
  .photo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px 16px 20px;
    position: relative;
    background: white;
  }
  .dot-pattern {
    position: absolute;
    top: 14px;
    right: 16px;
    display: grid;
    grid-template-columns: repeat(5, 6px);
    gap: 4px;
  }
  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #c8e6e6;
  }
  .name-block { margin-top: 4px; margin-bottom: 10px; }
  .name-first {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 1px;
    line-height: 1;
    text-transform: uppercase;
  }
  .name-last {
    font-size: 28px;
    font-weight: 800;
    color: #1a7a7a;
    letter-spacing: 1px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .title-bar {
    background: #1a7a7a;
    color: white;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    padding: 5px 12px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    margin-bottom: 12px;
    align-self: flex-start;
    min-width: 250px;
    position: relative;
  }
  .title-bar::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 0; bottom: 0;
    width: 6px;
    background: #0d5050;
    clip-path: polygon(0 0, 0 100%, 100% 100%);
  }
  .dept-line {
    font-size: 9.5px;
    color: #555;
    line-height: 1.35;
    margin-bottom: 10px;
    font-style: italic;
    max-width: 340px;
  }
  .contact-list { display: flex; flex-direction: column; gap: 5px; }
  .contact-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 11px;
    color: #333;
    line-height: 1.4;
  }
  .contact-icon { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
  .contact-icon svg { width: 14px; height: 14px; fill: #1a7a7a; }
</style>
</head>
<body>

</body>
